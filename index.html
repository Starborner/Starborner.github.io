<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipo Boyoweb</title>
  <style>
    /* Estilos generales */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    
    /* Cuadrícula para los miembros */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }
    
    /* Tarjeta de cada miembro */
    .member-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .member-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    
    .member-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .member-info {
      padding: 15px;
    }
    
    .member-info h3 {
      margin: 0;
      font-size: 1.5em;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Equipo Boyoweb</h1>
    <div class="team-grid">
      <div class="member-card">
        <img src="juan.jpg" alt="Miembro 1">
        <div class="member-info">
          <h3>Juan Diego Barrera Torres</h3>
        </div>
      </div>
      <div class="member-card">
        <img src="car.jpg" alt="Miembro 2">
        <div class="member-info">
          <h3>Andres Eduardo Morales Pizarro</h3>
        </div>
      </div>
      <div class="member-card">
        <img src="carito.jpg" alt="Miembro 3">
        <div class="member-info">
          <h3>María Carolina Hoyos Agudelo</h3>
        </div>
      </div>
      <div class="member-card">
        <img src="alex.jpg" alt="Miembro 4">
        <div class="member-info">
          <h3>Alex David Medellín Gary</h3>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Ejemplo de interactividad: mostrar un mensaje en la consola al cargar la página
    document.addEventListener('DOMContentLoaded', function(){
      console.log('Página del Equipo Boyoweb cargada');
    });
  </script>
</body>
</html>
